name: Build RIV VOCAL FORGE PRO (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64 -DRIV_FETCH_JUCE=ON

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target RIV_VOCAL_FORGE_VST3 RIV_VOCAL_FORGE_Standalone --parallel

      - name: Package VST3 and standalone
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $vst = Get-ChildItem -Path build -Directory -Filter 'RIV VOCAL FORGE.vst3' -Recurse | Select-Object -First 1
          if (-not $vst) { throw 'VST3 bundle was not found after a successful build.' }
          Copy-Item -Recurse $vst.FullName package/
          $exe = Get-ChildItem -Path build -File -Filter 'RIV VOCAL FORGE.exe' -Recurse | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName package/ }
          @'
          RIV VOCAL FORGE PRO - Windows x64
          Install: copy "RIV VOCAL FORGE.vst3" to C:\Program Files\Common Files\VST3\
          Then rescan plugins in FL Studio.
          '@ | Set-Content package/INSTALL.txt
          Compress-Archive -Path package/* -DestinationPath RIV-VOCAL-FORGE-Windows-x64.zip -Force

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: RIV-VOCAL-FORGE-Windows-x64
          path: RIV-VOCAL-FORGE-Windows-x64.zip
          if-no-files-found: error
